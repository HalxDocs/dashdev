# A minimal demo configuration used to run the dashboard for screenshots
# and a quick smoke test. Copy it to dashdev.yaml and run
#
#   bin/dashdev up
#
# alpha is a long-running service, beta is a one-shot service that exits
# cleanly. This exercises both a running service and an exited one.

version: 1

services:
  - name: alpha
    command: [sleep, 30]

  - name: beta
    command: [exit, 0]
