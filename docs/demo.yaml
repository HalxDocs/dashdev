# A minimal demo configuration used to run the dashboard for screenshots
# and a quick smoke test. Copy it to dashdev.yaml at the repository root
# and run
#
#   bin/dashdev up
#
# Both services are the integration test helper (testdata/helper) run with
# `go run`, so the demo works on any OS with Go installed and needs no
# platform-specific commands.
#
# alpha serves until stopped, beta exits cleanly at once. This exercises
# both a running service and an exited one.

version: 1

services:
  - name: alpha
    command: [go, run, ./testdata/helper, -mode, serve, -label, alpha]

  - name: beta
    command: [go, run, ./testdata/helper, -mode, exit, -code, 0, -label, beta]
